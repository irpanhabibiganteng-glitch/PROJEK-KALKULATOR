    <!-- NAVBAR -->
    <div class="flex items-center justify-between mb-6">

      <div class="flex items-center gap-4">

        <!-- MENU -->
        <div class="w-[18px] h-[13px] flex flex-col justify-between cursor-pointer shrink-0">
          <span class="block h-[2px] rounded bg-[#8a8d98]"></span>
          <span class="block h-[2px] rounded bg-[#8a8d98]"></span>
          <span class="block h-[2px] rounded bg-[#8a8d98]"></span>
        </div>

        <!-- NAVIGATION -->
        <div class="flex gap-3.5 text-[12px] flex-wrap justify-center sm:justify-start">

          <!-- STANDARD ACTIVE -->
          <span class="text-white cursor-pointer pb-2 relative after:content-[''] after:absolute after:left-0 after:right-0 after:-bottom-2.5 after:h-0.5 after:bg-blue-500 after:rounded-full">
            Standard
          </span>

          <!-- SCIENTIFIC -->
          <a href="./scientific.html" class="text-[#6f7280] cursor-pointer pb-2 hover:text-white transition-colors duration-300">

            Graph

          <!-- PROGRAMMER -->

          </a>

    <!-- DISPLAY -->

      <div id="expression" class="text-[13px] text-[#6f7280] mb-1.5 tracking-wide">
        &nbsp;
      </div>

      <div id="result" class="text-[32px] sm:text-[40px] font-medium text-white tracking-wide truncate">
        0
      </div>

    </div>

    <!-- MEMORY -->
    <div class="grid grid-cols-5 gap-2 mb-2">

      <button class="rounded-[10px] text-[#8a8d98] text-[12.5px] py-2 hover:bg-[#1d1e26] transition-colors">MC</button>
      <button class="rounded-[10px] text-[#8a8d98] text-[12.5px] py-2 hover:bg-[#1d1e26] transition-colors">MR</button>
      <button class="rounded-[10px] text-[#8a8d98] text-[12.5px] py-2 hover:bg-[#1d1e26] transition-colors">M+</button>
      <button class="rounded-[10px] text-[#8a8d98] text-[12.5px] py-2 hover:bg-[#1d1e26] transition-colors">M-</button>
      <button class="rounded-[10px] text-[#8a8d98] text-[12.5px] py-2 hover:bg-[#1d1e26] transition-colors">MS</button>

    </div>

    <!-- BUTTONS -->
    <div class="grid grid-cols-4 gap-2 flex-1">

      <!-- ROW 1 -->
      <button class="rounded-[10px] bg-[#24406e] text-[#cfe0ff] font-medium text-sm hover:bg-[#2b4a80] transition-colors">%</button>
      <button class="rounded-[10px] bg-[#24406e] text-[#cfe0ff] font-medium text-sm hover:bg-[#2b4a80] transition-colors">CE</button>
      <button class="rounded-[10px] bg-[#24406e] text-[#cfe0ff] font-medium text-sm hover:bg-[#2b4a80] transition-colors">C</button>

      <!-- ROW 2 -->
      <button class="rounded-[10px] bg-[#23242c] text-white text-[17px] hover:bg-[#2b2c36] transition-colors">7</button>

      <button class="rounded-[10px] bg-[#23242c] text-white hover:bg-[#2b2c36] transition-colors">&divide;</button>

      <button class="rounded-[10px] bg-[#23242c] text-white text-[17px] hover:bg-[#2b2c36] transition-colors">4</button>
      <button class="rounded-[10px] bg-[#23242c] text-white text-[17px] hover:bg-[#2b2c36] transition-colors">5</button>
      <button class="rounded-[10px] bg-[#23242c] text-white text-[17px] hover:bg-[#2b2c36] transition-colors">6</button>
      <button class="rounded-[10px] bg-[#23242c] text-white hover:bg-[#2b2c36] transition-colors">&times;</button>

      <!-- ROW 4 -->
      <button class="rounded-[10px] bg-[#23242c] text-white text-[17px] hover:bg-[#2b2c36] transition-colors">1</button>
      <button class="rounded-[10px] bg-[#23242c] text-white text-[17px] hover:bg-[#2b2c36] transition-colors">2</button>
      <button class="rounded-[10px] bg-[#23242c] text-white text-[17px] hover:bg-[#2b2c36] transition-colors">3</button>

      <button class="rounded-[10px] bg-[#23242c] text-white text-[17px] hover:bg-[#2b2c36] transition-colors">&plusmn;</button>
      <button class="rounded-[10px] bg-[#23242c] text-white text-[17px] hover:bg-[#2b2c36] transition-colors">0</button>

      <!-- SAMA DENGAN -->
      <button class="rounded-[10px] text-white bg-[#3b7cf6] hover:bg-[#4a86f8] transition-colors">=</button>

    </div>
  </div>

  <script src="./standard.js"></script>

  <!-- PAGE TRANSITION -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.body.classList.add("page-loaded");

      document.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function (e) {
          const href = this.getAttribute("href");

          if (!href || href.startsWith("#")) return;

          e.preventDefault();
          document.body.classList.remove("page-loaded");

          setTimeout(function () {
            window.location.href = href;
          }, 350);
        });
      });
    });
  </script>

</body>
</html>
