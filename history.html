<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { opacity: 0; transition: opacity 0.35s ease; }
    body.page-loaded { opacity: 1; }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 sm:p-5 bg-[linear-gradient(135deg,#0b1226_0%,#16213e_45%,#1f2e52_100%)] font-sans overflow-x-hidden">

  <!-- MAIN WINDOW -->
  <div class="w-full max-w-[590px] min-h-[532px] bg-black rounded-[18px] overflow-hidden shadow-[0_30px_80px_rgba(0,0,0,.55)]">

    <!-- TOP NAVIGATION -->
    <div class="h-[51px] flex items-center border-b border-[#202020] bg-black">

      <!-- Hamburger -->
      <div class="w-[52px] h-full flex items-center justify-center shrink-0 cursor-pointer">
        <div class="w-[18px] h-[14px] flex flex-col justify-between">
          <span class="h-[2px] bg-gray-400 rounded"></span>
          <span class="h-[2px] bg-gray-400 rounded"></span>
          <span class="h-[2px] bg-gray-400 rounded"></span>
        </div>
      </div>

      <!-- Navigation -->
      <div class="flex items-center h-full flex-1 text-[12px] gap-1 overflow-x-auto whitespace-nowrap">

        <a href="./standard.html" class="flex-1 min-w-[70px] text-center text-gray-400 hover:text-white transition">Standard</a>

        <a href="./scientific.html" class="flex-1 min-w-[70px] text-center text-gray-400 hover:text-white transition">Scientific</a>

        <a href="./graph.html" class="flex-1 min-w-[60px] text-center text-gray-400 hover:text-white transition">Graph</a>

        <a href="./programer.html" class="flex-1 min-w-[80px] text-center text-gray-400 hover:text-white transition">Programmer</a>

        <a href="./conventer.html" class="flex-1 min-w-[80px] text-center text-gray-400 hover:text-white transition">Converter</a>

        <a href="./history.html" class="relative flex-1 min-w-[60px] h-full flex items-center justify-center text-white">
          History
          <span class="absolute left-1/2 -translate-x-1/2 bottom-[9px] w-[44px] h-[2px] bg-blue-500 rounded-full"></span>
        </a>

      </div>
    </div>

    <!-- HISTORY CONTENT -->
    <main class="h-[481px] bg-black px-[23px] pt-[18px]">

      <!-- TITLE -->
      <h1 class="text-[21px] font-normal text-white mb-[21px]">History</h1>

      <!-- HISTORY BOX -->
      <div class="h-[336px] w-full rounded-[11px] border border-[#303030] bg-black overflow-hidden">

        <!-- HISTORY ITEM 1 -->
        <div class="flex items-center justify-between px-[12px] pt-[13px]">
          <span class="text-[15px] text-[#666]">(256 + 123) x (645 + 25)</span>
          <span class="text-[15px] text-[#666] pr-[31px]">= 12,810.2</span>
        </div>

        <!-- HISTORY ITEM 2 -->
        <div class="flex items-center justify-between px-[12px] pt-[27px]">
          <span class="text-[15px] text-[#666]">sin(45) + log(100) x 2</span>
          <span class="text-[15px] text-[#666] pr-[31px]">= 2.1213203436</span>
        </div>

        <!-- HISTORY ITEM 3 -->
        <div class="flex items-center justify-between px-[12px] pt-[27px]">
          <span class="text-[15px] text-[#666]">2,568 ÷ 12</span>
          <span class="text-[15px] text-[#666] pr-[31px]">= 214</span>
        </div>

        <!-- HISTORY ITEM 4 -->
        <div class="flex items-center justify-between px-[12px] pt-[27px]">
          <span class="text-[15px] text-[#666]">(25 + 17) x 4</span>
          <span class="text-[15px] text-[#666] pr-[31px]">= 93</span>
        </div>

        <!-- HISTORY ITEM 5 -->
        <div class="flex items-center justify-between px-[12px] pt-[27px]">
          <span class="text-[15px] text-[#666]">tan(60) x cos(30)</span>
          <span class="text-[15px] text-[#666] pr-[31px]">= 1.5</span>
        </div>

      </div>

      <!-- BOTTOM ACTION BAR -->
      <div class="h-[61px] -mx-[16px] mt-[18px] border-t border-[#202020] flex items-center justify-between px-[23px]">

        <!-- CLEAR HISTORY -->
        <button class="text-[14px] text-red-500 hover:text-red-400 transition">
          Clear History
        </button>

        <!-- EXPORT -->
        <button class="flex items-center gap-[12px] text-[14px] text-blue-500 hover:text-blue-400 transition">
          <span>Export</span>

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V3" />
            <path d="M8 7L12 3L16 7" />
            <path d="M5 11V20H19V11" />
          </svg>
        </button>

      </div>
    </main>
  </div>

  <!-- PAGE TRANSITION -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("page-loaded");

      document.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", (e) => {
          const href = link.getAttribute("href");

          if (!href || href.startsWith("#")) return;

          e.preventDefault();
          document.body.classList.remove("page-loaded");

          setTimeout(() => {
            window.location.href = href;
          }, 350);
        });
      });
    });
  </script>

</body>
</html>
